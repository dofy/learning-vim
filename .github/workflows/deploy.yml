name: Sync and deploy static course

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dofy/learn-vim
          path: _content/learn-vim
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          LEARN_VIM_CONTENT_DIR: ${{ github.workspace }}/_content/learn-vim
      - uses: actions/configure-pages@v5
        if: vars.ENABLE_GITHUB_PAGES == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        with:
          path: dist

  deploy:
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
