name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dofy/learn-vim
          path: _content/learn-vim
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          LEARN_VIM_CONTENT_DIR: ${{ github.workspace }}/_content/learn-vim
